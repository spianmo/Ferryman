name: build-package

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triplet: x64-linux
            package_suffix: linux-x64
            package_ext: tar.gz
          - os: macos-14
            triplet: arm64-osx
            package_suffix: macos-arm64
            package_ext: tar.gz
          - os: windows-2022
            triplet: x64-windows-static
            package_suffix: windows-x64
            package_ext: zip

    env:
      BUILD_DIR: build
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            nasm \
            yasm \
            libx11-dev \
            libxext-dev \
            libxtst-dev \
            libxi-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install nasm yasm

      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend assets
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Patch vcpkg manifest for macOS CI (disable x265 only in CI)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "vcpkg.json";
            const json = JSON.parse(fs.readFileSync(file, "utf8"));
            if (Array.isArray(json.dependencies)) {
              for (const dep of json.dependencies) {
                if (dep && typeof dep === "object" && dep.name === "ffmpeg" && Array.isArray(dep.features)) {
                  dep.features = dep.features.filter((feature) => feature !== "x265");
                }
              }
            }
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + "\n");
          '
          cat vcpkg.json

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            .vcpkg-binary-cache
            .vcpkg-downloads
            vcpkg_installed/${{ matrix.triplet }}
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json', 'scripts/make_deps.sh') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Prepare vcpkg cache directories
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$VCPKG_DOWNLOADS" .vcpkg-binary-cache "vcpkg_installed/${{ matrix.triplet }}"

      - name: Prepare vcpkg cache directories (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:VCPKG_DOWNLOADS" -Force | Out-Null
          New-Item -ItemType Directory -Path ".vcpkg-binary-cache" -Force | Out-Null
          New-Item -ItemType Directory -Path "vcpkg_installed/${{ matrix.triplet }}" -Force | Out-Null

      - name: Setup vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install C++ dependencies (vcpkg manifest)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet "${{ matrix.triplet }}"

      - name: Install C++ dependencies (vcpkg manifest, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet "${{ matrix.triplet }}"

      - name: Verify libhv OpenSSL backend
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          HCONFIG="vcpkg_installed/${{ matrix.triplet }}/include/hv/hconfig.h"
          if [[ ! -f "$HCONFIG" ]]; then
            echo "hconfig.h not found: $HCONFIG"
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*#define[[:space:]]+WITH_OPENSSL[[:space:]]+1([[:space:]]|$)' "$HCONFIG"; then
            echo "WITH_OPENSSL is not enabled in $HCONFIG"
            echo "---- $HCONFIG ----"
            sed -n '1,200p' "$HCONFIG"
            exit 1
          fi
          echo "Verified WITH_OPENSSL=1 in $HCONFIG"

      - name: Verify libhv OpenSSL backend (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hconfig = "vcpkg_installed/${{ matrix.triplet }}/include/hv/hconfig.h"
          if (-not (Test-Path $hconfig)) {
            throw "hconfig.h not found: $hconfig"
          }
          $content = Get-Content $hconfig -Raw
          if ($content -notmatch "(?m)^\s*#define\s+WITH_OPENSSL\s+1(\s|$)") {
            Write-Host "WITH_OPENSSL is not enabled in $hconfig"
            Write-Host "---- $hconfig ----"
            Get-Content $hconfig
            throw "libhv OpenSSL backend verification failed"
          }
          Write-Host "Verified WITH_OPENSSL=1 in $hconfig"

      - name: Dump x265 build logs on macOS failure
        if: ${{ failure() && runner.os == 'macOS' }}
        shell: bash
        run: |
          set +e
          echo "==== vcpkg x265 logs ===="
          ls -la "$VCPKG_ROOT/buildtrees/x265" || true
          for f in \
            "$VCPKG_ROOT/buildtrees/x265/config-arm64-osx-dbg-CMakeCache.txt.log" \
            "$VCPKG_ROOT/buildtrees/x265/config-arm64-osx-rel-CMakeCache.txt.log" \
            "$VCPKG_ROOT/buildtrees/x265/config-arm64-osx-dbg-CMakeConfigureLog.yaml.log" \
            "$VCPKG_ROOT/buildtrees/x265/config-arm64-osx-rel-CMakeConfigureLog.yaml.log" \
            "$VCPKG_ROOT/buildtrees/x265/config-arm64-osx-out.log"; do
            if [[ -f "$f" ]]; then
              echo "---- $f ----"
              cat "$f"
            fi
          done

      - name: Configure (Release)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DFERRYMAN_BUILD_FRONTEND=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"

      - name: Configure (Release, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B "$env:BUILD_DIR" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DFERRYMAN_BUILD_FRONTEND=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.triplet }}"

      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_PATH="$BUILD_DIR/Ferryman"
          if [[ ! -f "$BIN_PATH" ]]; then
            BIN_PATH="$BUILD_DIR/Release/Ferryman"
          fi
          if [[ ! -f "$BIN_PATH" ]]; then
            echo "Ferryman binary not found."
            exit 1
          fi

          PKG_ROOT="package/ferryman-${{ matrix.package_suffix }}"
          mkdir -p "$PKG_ROOT"
          cp "$BIN_PATH" "$PKG_ROOT/"
          package_docs=(README.md LICENSE)
          for doc in README_CN.md README_EN.md; do
            if [[ -f "$doc" ]]; then
              package_docs+=("$doc")
            fi
          done
          cp "${package_docs[@]}" "$PKG_ROOT/"

          tar -czf "ferryman-${{ matrix.package_suffix }}.tar.gz" -C package "ferryman-${{ matrix.package_suffix }}"

          if [[ "${{ runner.os }}" == "Linux" ]]; then
            PROXY_BIN_PATH="$BUILD_DIR/FerrymanProxy"
            if [[ ! -f "$PROXY_BIN_PATH" ]]; then
              PROXY_BIN_PATH="$BUILD_DIR/Release/FerrymanProxy"
            fi
            if [[ ! -f "$PROXY_BIN_PATH" ]]; then
              echo "FerrymanProxy binary not found."
              exit 1
            fi

            PROXY_PKG_ROOT="package/ferryman-proxy-${{ matrix.package_suffix }}"
            mkdir -p "$PROXY_PKG_ROOT"
            cp "$PROXY_BIN_PATH" "$PROXY_PKG_ROOT/"
            cp "${package_docs[@]}" scripts/ferryman-proxy.service scripts/deploy_ferryman_proxy.sh "$PROXY_PKG_ROOT/"
            tar -czf "ferryman-proxy-${{ matrix.package_suffix }}.tar.gz" -C package "ferryman-proxy-${{ matrix.package_suffix }}"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binCandidates = @(
            "$env:BUILD_DIR/Ferryman.exe",
            "$env:BUILD_DIR/Release/Ferryman.exe"
          )
          $binPath = $binCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $binPath) {
            throw "Ferryman.exe not found."
          }

          $pkgRoot = "package/ferryman-${{ matrix.package_suffix }}"
          New-Item -ItemType Directory -Path $pkgRoot -Force | Out-Null
          Copy-Item $binPath "$pkgRoot/Ferryman.exe" -Force
          $packageDocs = @("README.md", "README_CN.md", "README_EN.md", "LICENSE") | Where-Object { Test-Path $_ }
          Copy-Item $packageDocs $pkgRoot -Force

          $zipPath = "ferryman-${{ matrix.package_suffix }}.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$pkgRoot/*" -DestinationPath $zipPath

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferryman-${{ matrix.package_suffix }}
          path: ferryman-${{ matrix.package_suffix }}.${{ matrix.package_ext }}
          if-no-files-found: error

      - name: Upload artifact (FerrymanProxy Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ferryman-proxy-${{ matrix.package_suffix }}
          path: ferryman-proxy-${{ matrix.package_suffix }}.tar.gz
          if-no-files-found: error

      - name: Upload artifact (FerrymanProxy deploy script)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ferryman-proxy-deploy-script-${{ matrix.package_suffix }}
          path: scripts/deploy_ferryman_proxy.sh
          if-no-files-found: error

  publish-release:
    name: Publish release assets
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            RELEASE_TITLE="${GITHUB_REF_NAME}"
            RELEASE_PRERELEASE="false"
            RELEASE_GENERATE_NOTES="true"
            RELEASE_MAKE_LATEST="true"
          else
            RELEASE_TAG="build-${GITHUB_SHA}"
            RELEASE_TITLE="${GITHUB_SHA}"
            RELEASE_PRERELEASE="true"
            RELEASE_GENERATE_NOTES="false"
            RELEASE_MAKE_LATEST="false"
          fi
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "release_prerelease=${RELEASE_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_generate_notes=${RELEASE_GENERATE_NOTES}" >> "$GITHUB_OUTPUT"
          echo "release_make_latest=${RELEASE_MAKE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_meta.outputs.release_prerelease }}
          make_latest: ${{ steps.release_meta.outputs.release_make_latest }}
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/**/*.sh
          overwrite_files: true
          generate_release_notes: ${{ steps.release_meta.outputs.release_generate_notes }}
